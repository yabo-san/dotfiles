# obsidian-icloud-windows-sync config, passed to the daemon by start-sync-daemon.ps1.
# Kept in chezmoi, not the clone, where upstream's untracked my-config.yaml is one git pull from clobbered.

paths:
  local_vault: "D:\\obsidian\\sb"
  icloud_vault: "D:\\iCloudDrive\\iCloud~md~obsidian\\sb"
  history_dir: "D:\\obsidian\\history"
  logs_dir: "D:\\obsidian\\logs"

sync:
  run_continuously: true

  # Must be false on iCloud for Windows 15.9: every file is a reparse placeholder, so all read as CLOUD_ONLY
  # and wait_until_uploaded() spins forever. Safe off: an unavailable file fails loudly on read, never truncates.
  check_icloud_status: false

  poll_interval: 2
  # Raised above upstream (3 / 8): mtime/size keep moving while iCloud hydrates, which makes phantom conflicts.
  stability_window: 5
  stabilize_wait: 60
  tiny_threshold: 8
  # Quiet-period debounce (yabo-san fork): sync only after a file stops changing in both vaults this long.
  # Obsidian autosaves every ~2s; pushing each save made iCloud fork the note into copies (2026-09-01).
  quiet_period: 20
  quiet_max_wait: 600

logging:
  # "quiet", not "normal": the idle "No changes." ticker grows the redirected log forever and killed
  # the daemon on 2026-09-22 (OSError 22). Transfers and warnings still log.
  console_level: "quiet" # quiet | normal | verbose
  shorter_paths: true
  max_display_length: 50
  # Retention is by file count, not size, with no in-run rotation; the ignore rules are the real defence.
  log_retention: 10

ignore:
  patterns:
    - ".obsidian/appearance.json"
    - ".obsidian/cache"
    - ".obsidian/app.json"
    - ".obsidian/workspace*.json"
    - ".obsidian/plugins/*/data.json"

    # Plugin code: the atomic tmp -> os.replace write re-queued itself forever (2026-07-08). fnmatch * spans
    # separators, so this covers every plugin. Cost: install plugins per device.
    - ".obsidian/plugins/*"

    # A wedged file can be quarantined here as a stopgap, but the daemon then ignores it in both directions.
  dirs:
    - ".trash"
    - ".fseventsd"
    - ".spotlight-v100"
    - ".apdisk"
  files:
    - ".ds_store"
    - ".trash"
    - "workspace.json"
    - "workspace-mobile.json"

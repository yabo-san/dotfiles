general:
  # Commands to run when the WM has started. This is useful for running a
  # script or launching another application.
  startup_commands: []

  # Commands to run just before the WM is shutdown.
  shutdown_commands: []

  # Commands to run after the WM config is reloaded.
  config_reload_commands: []

  # Whether to automatically focus windows underneath the cursor.
  focus_follows_cursor: false

  # Whether to switch back and forth between the previously focused
  # workspace when focusing the current workspace.
  toggle_workspace_on_refocus: true # tapping the workspace key you're already on flips back -> makes lwin+d a true show-desktop toggle

  cursor_jump:
    # Whether to automatically move the cursor on the specified trigger.
    enabled: true

    # Trigger for cursor jump:
    # - 'monitor_focus': Jump when focus changes between monitors.
    # - 'window_focus': Jump when focus changes between windows.
    trigger: "monitor_focus"

  # How windows should be hidden when switching workspaces.
  # - 'cloak': Recommended. Hides windows with no animation.
  # - 'hide': Legacy method (v3.5 and earlier) that has a brief animation,
  # but has stability issues with some apps.
  hide_method: "cloak"

  # Affects which windows get shown in the native Windows taskbar. Has no
  # effect if `hide_method: 'hide'`.
  # - 'true': Show all windows (regardless of workspace).
  # - 'false': Only show windows from the currently shown workspaces.
  show_all_in_taskbar: false

gaps:
  # Whether to scale the gaps with the DPI of the monitor.
  scale_with_dpi: true

  # Gap between adjacent windows.
  inner_gap: "10px"

  # Gap between windows and the screen edge.
  outer_gap:
    top: "40px"
    right: "10px"
    bottom: "15px"
    left: "10px"

window_effects:
  # Visual effects to apply to the focused window.
  focused_window:
    # Highlight the window with a colored border.
    # ** Exclusive to Windows 11 due to API limitations.
    border:
      enabled: true
      color: "#8dbcff"

    # Remove the title bar from the window's frame. Note that this can
    # cause rendering issues for some applications.
    hide_title_bar:
      enabled: false

    # Change the corner style of the window's frame.
    # ** Exclusive to Windows 11 due to API limitations.
    corner_style:
      enabled: false
      # Allowed values: 'square', 'rounded', 'small_rounded'.
      style: "square"

    # Change the transparency of the window.
    transparency:
      enabled: false
      # Can be something like '95%' or '0.95' for slightly transparent windows.
      # '0' or '0%' is fully transparent (and, by consequence, unfocusable).
      opacity: "95%"

  # Visual effects to apply to non-focused windows.
  other_windows:
    border:
      enabled: true
      color: "#a1a1a1"
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: false
      style: "square"
    transparency:
      enabled: false
      opacity: "0%"

window_behavior:
  # New windows are created in this state whenever possible.
  # Allowed values: 'tiling', 'floating'.
  #
  # DEFAULT TILING — everything tiles unless explicitly floated or ignored below.
  # Games are all fullscreen special cases so they float via the deny rules.
  # Use lwin+t to toggle any edge-case window manually.
  initial_state: "floating"

  # Sets the default options for when a new window is created. This also
  # changes the defaults for when the state change commands, like
  # `set-floating`, are used without any flags.
  state_defaults:
    floating:
      # Whether to center floating windows by default.
      centered: true

      # Whether to show floating windows as always on top.
      shown_on_top: false

    fullscreen:
      # Maximize the window if possible. If the window doesn't have a
      # maximize button, then it'll be fullscreen'ed normally instead.
      maximized: false

      # Whether to show fullscreen windows as always on top.
      shown_on_top: false

workspaces:
  # 7-BUCKET LAYOUT (2026-06-06) — consolidated from 10 buckets.
  # display_name carries a purpose ICON (Font Awesome glyphs in Hack NF).
  - name: "1"
    display_name: "" # main (home)
    keep_alive: true
    # The main productivity workspace - it belongs on the ultrawide.
    # It had NO binding, which is why it drifted onto the CRT twice on
    # 2026-07-31 and had to be moved back by hand. An unbound workspace lands
    # wherever it is activated and never self-corrects; a bound one re-homes
    # itself on activation, which also lets it recover by itself after a game
    # solos a monitor and pushes it off.
    bind_to_monitor: 2 # LG ultrawide (GSM772B) - 0-based, left-to-right
  - name: "2"
    display_name: "" # comms (comments)
    keep_alive: true
    # bind_to_monitor is a 0-BASED index, ordered LEFT-TO-RIGHT by x-coordinate
    # (glazewm dispatcher.rs sorted_displays). Live order here is:
    #   0 = Acer XG270HU (ACR0414)   1 = CRT (1024x768)   2 = LG ultrawide (GSM772B)
    # This said 1 and was therefore homing comms onto the CRT. Confirm after any
    # monitor rearrangement with:  glazewm query monitors
    bind_to_monitor: 0 # Acer (XG270HU, ACR0414)
  - name: "3"
    display_name: "" # music (note)
    keep_alive: true
    bind_to_monitor: 0 # Acer (see note on workspace 2 — 0-based, left-to-right)
  - name: "4"
    display_name: "" # gamedev (paintbrush)
    keep_alive: true
    bind_to_monitor: 2 # ultrawide
  - name: "5"
    display_name: "" # play (gamepad)
    keep_alive: true
    bind_to_monitor: 2 # ultrawide
  - name: "6"
    display_name: "" # media (film)
    keep_alive: true

  - name: "7"
    display_name: "" # utils (wrench)
    keep_alive: true
    bind_to_monitor: 2 # ultrawide
  - name: "8"
  - name: "9"
  - name: "10"
  - name:
      "0" # SHOW-DESKTOP scratch: nothing homes here, so it's always empty = wallpaper +
      # desktop icons. lwin+d flips to it; lwin+d again flips back (toggle_workspace_on_refocus).

window_rules:
  # =====================================================================
  # ALLOWLIST — the ONLY windows that tile. Everything else floats (see
  # DEFAULT TILING MODEL — everything tiles unless floated or ignored below.
  # OPT-IN TILING — only listed apps tile. Everything else floats (games, unknown exes).
  # Games go fullscreen and are fine; use lwin+t to float any edge case.

  # --- Workspace 1: MAIN (ultrawide) ---
  - commands: ["set-tiling", "move --workspace 1"]
    match:
      - window_process: { regex: "Proton Mail" }
      - window_process: { regex: "zen" }
      - window_process: { equals: "7zFM" }
      - window_process: { equals: "explorer" }
        window_class: { equals: "CabinetWClass" }
      - window_process: { equals: "FPilot" }
      - window_process: { equals: "EXCEL" }
        window_class: { equals: "XLMAIN" }
      - window_process: { equals: "WINWORD" }
        window_class: { equals: "OpusApp" }
      - window_process: { equals: "POWERPNT" }
        window_class: { equals: "PPTFrameClass" }

  # --- Workspace 2: COMMS (Acer) ---
  - commands: ["set-tiling", "move --workspace 2"]
    match:
      - window_process:
          { regex: "DiscordPTB|Discord|Vesktop|Slack|Teams|Telegram|Beeper" }

  # --- Workspace 3: MUSIC (Acer) ---
  - commands: ["set-tiling", "move --workspace 3"]
    match:
      - window_process: { regex: "Cider|[sS]potify|SoulseekQt" }

  # --- Workspace 4: GAMEDEV (ultrawide) ---
  - commands: ["set-tiling", "move --workspace 4"]
    match:
      - window_process:
          {
            regex: "Code|Cursor|devenv|[Zz]ed|neovide|pycharm64|rider64|GMEdit",
          }
      - window_process:
          {
            regex: "Aseprite|paintdotnet|blender|HxD|[Gg]odot|Tiled|LDtk|GameMaker|microStudio|pico8|picotron|[Vv]oxatron|GB.?Studio|gb-studio|TrenchBroom|picocad|MagicaVoxel|[Ss]olarus",
          }
      - window_process: { regex: "Claude|LM Studio" }

  # --- Workspace 5: PLAY — Playnite floats (popups/dialogs must not tile) ---
  - commands: ["move --workspace 5"]
    match:
      - window_process: { equals: "Playnite" }

  # --- Workspace 6: MEDIA — Fladder (fullscreen wherever) ---
  - commands: ["set-tiling", "move --workspace 6"]
    match:
      - window_process: { equals: "fladder" }
      - window_process: { regex: "vlc|FreeTube" }

  # --- Workspace 7: UTILS ---
  - commands: ["set-tiling", "move --workspace 7"]
    match:
      - window_process: { equals: "logioptionsplus" }
      - window_process: { equals: "SystemSettings" }
      - window_process: { equals: "Taskmgr" }
      - window_process: { equals: "regedit" }
      - window_process: { equals: "SystemInformer" }
      - window_process: { regex: "Hotspot Shield" }
      - window_process: { equals: "deskflow" }

  # --- FLOAT — things that must never tile ---
  - commands: ["set-floating"]
    match:
      - window_process: { regex: "steam|SteamWebHelper" }
      - window_process: { equals: "EpicGamesLauncher" }
      - window_process: { equals: "GalaxyClient" }

  # --- CLAW BACK the main windows the blanket float above over-caught ---
  # Rules run IN ORDER and EVERY matching rule runs
  # (wm/src/commands/window/run_window_rules.rs), so a later `set-tiling` beats
  # the earlier `set-floating`. These MUST stay below the float block.
  #
  # Steam renders through steamwebhelper and EVERY Steam surface shares the
  # `SDL_app` class — friends list, notification toasts, the login box — so the
  # class cannot tell them apart. The title can: the main client is the one
  # titled exactly "Steam". Popups keep floating, which is what the blanket rule
  # was protecting in the first place.
  - commands: ["set-tiling", "move --workspace 5"]
    match:
      - window_process: { equals: "steamwebhelper" }
        window_title: { equals: "Steam" }

  # RustDesk is the same class of thing as deskflow — remote input/control — so
  # it lives in UTILS. Flutter app, one window class for both the ID panel and
  # any remote session, so the process alone is a safe match.
  - commands: ["set-tiling", "move --workspace 7"]
    match:
      - window_process: { equals: "rustdesk" }

  # --- Dishonored 2 (Void engine) ---
  # Spawns a small windowed "VoidEngine v1.77.9.0" splash first, then flips to
  # fullscreen once the menu is loaded. GlazeWM grabs the tiny init window and
  # SNAPSHOTS that frame (manage_window.rs:189-209), then re-applies it on every
  # redraw — so the game looks like it "won't launch" while the two fight over
  # the rect. Force fullscreen the instant it appears so it never tiles or gets
  # pinned at splash size.
  - commands: ["set-fullscreen"]
    match:
      - window_process: { equals: "Dishonored2" }

  # =====================================================================
  # IGNORE — true overlays/bars that must NOT be managed at all (no border,
  # no workspace tracking). Distinct from "floating": floated windows still
  # get borders and move with workspaces; ignored ones are invisible to the WM.
  # =====================================================================
  - commands: ["ignore"]
    match:
      # Status bars (running both zebar and yasb)
      - window_process: { regex: "zebar|yasb" }

      # Windows shell surfaces — Start menu, Search, Action Center, etc.
      # MUST be ignored or GlazeWM steals focus back the instant they open,
      # dismissing them (Start "opens for a second then closes"). Also stops
      # GlazeWM from yanking Start onto the wrong monitor.
      - window_process:
          { regex: "StartMenuExperienceHost|SearchHost|ShellExperienceHost" }

      # Windows Terminal = the quake-style dropdown console. Must stay
      # unmanaged so it floats over the layout instead of tiling.
      - window_process: { equals: "WindowsTerminal" }

      # WezTerm — fully ignored (guake/dropdown style, always floating).
      - window_process: { equals: "wezterm-gui" }

      # ShaderGlass overlay (yabo-launcher CRT/shader overlay) — must sit
      # click-through on top of the game window; managing it breaks it.
      - window_process: { equals: "ShaderGlass" }

      # Unreal Engine 3 games (Dishonored is the one that bites).
      #
      # A UE3 game creates its window TINY - 160x120 - during init, before it
      # knows its resolution. GlazeWM claims it at that moment and SNAPSHOTS that
      # size as the floating placement (manage_window.rs:189-209, "use the
      # original width/height of the window"). The snapshot is never revisited,
      # so the window is frozen tiny forever - and worse, GlazeWM keeps
      # RE-APPLYING it. Three SetWindowPos attempts to move Dishonored to the
      # Acer were each yanked straight back, and the two sides fighting made the
      # window visibly flicker.
      #
      # A CLASS rule, not a per-game one: every UE3 title behaves this way, and
      # this config must never become a dictionary of individual games.
      #
      # Ignoring is what MAKES placement work. The Playnite worker moves and
      # sizes the window itself with raw SetWindowPos, which lands first try on
      # an unmanaged window - exactly why The Dark Mod (managed=no) placed
      # cleanly while Dishonored (managed=yes) could not.
      # (UE3 ignore rule removed - GlazeWM CAN move these windows; it beat raw
      #  SetWindowPos three times. The problem was the FLOATING snapshot, not
      #  management itself. Handled with set-tiling/fullscreen instead.)

      # Borderless Gaming — a tray utility that manipulates OTHER windows; there
      # is nothing for a tiling WM to gain by managing it, and plenty to lose.
      # Observed 2026-07-31: GlazeWM caught it mid-startup at 146x32 and pinned
      # it there permanently, making the UI unclickable. That is not a bug in
      # Borderless Gaming — manage_window.rs:189-209 SNAPSHOTS a floating
      # window's frame the instant it is managed ("Use the original width/height
      # of the window") and re-applies that rect on every redraw. clamp_size
      # there is a MAXIMUM only, so tiny in = tiny forever. Any app that sizes
      # its window after creating it is exposed to this while
      # window_behavior.initial_state is "floating".
      - window_process: { equals: "BorderlessGaming" }

      # Epic Games Launcher (Unreal Engine / Slate) — CRASHES when managed.
      # GlazeWM's window_effects (border/title-bar/corner) call DWM frame APIs
      # (DwmExtendFrameIntoClientArea) on the same window Unreal is extending,
      # tripping Unreal's assertion (WindowsWindow.cpp:363) -> hard crash.
      # IGNORE (not just float) so GlazeWM never touches its frame. Matched by
      # process AND by UnrealWindow class to catch other Unreal apps too.
      - window_process: { equals: "EpicGamesLauncher" }
      - window_class: { regex: "UnrealWindow" }

      # NOTE (2026-07-31): Dishonored was briefly ignored here while chasing a
      # launch crash. That was WRONG for this setup. `ignore` is hands-off in
      # BOTH directions — GlazeWM stops crashing it, but also can no longer move
      # it, give it a workspace, or fullscreen it, which is the entire point.
      # A game window has to stay MANAGED so it can get its own workspace and be
      # fullscreened over the bar; the borderless strip then makes it seamless.
      # If a UE3 title does turn out to crash under management, the fix is to
      # disable window_effects borders (the DWM calls are the crash vector), not
      # to ignore the window.

      # yabo-shader-hud — launcher's shader HUD overlay; must stay unmanaged
      # so it sits over the game window. Matched by title (window_title regex).
      - window_title: { regex: "yabo-shader-hud" }

      # Crysis / Crysis Wars / Warhead / Sandbox 2 editor (CryEngine 2). Old D3D9
      # init races GlazeWM's DWM border APIs (same crash vector as Epic/Unreal).
      # Ignore the launcher, editor, and game windows so the WM never touches
      # their frames.
      - window_process: { regex: "EditorLauncher|Sandbox2|Crysis|Crysis64|CrysisWars|CrysisWars64" }

      # DOOM (2016, id Tech 6 'Zion' engine, process DOOMx64vk). Ignore so
      # GlazeWM never touches the game window. Also match the Zion class +
      # common DOOM/Quake engine exes so other id-tech games are hands-off too.
      - window_process: { regex: "DOOMx64vk|DOOMEternal|DOOMTheDarkAges" }
      - window_class: { equals: "Zion" }

      # The Dark Mod (idTech4 fork). r_fullscreen=2 borderless windowed mode;
      # GlazeWM's DWM border APIs race DirectInput acquire on launch → no mouse grab.
      - window_process: { regex: "TheDarkMod|thedarkmod" }

      # MGS HD Collection (METAL GEAR SOLID3.exe, class CSD3DWND). Same DWM
      # crash as EpicGamesLauncher: GlazeWM's border API races D3D11 init.
      - window_class: { equals: "CSD3DWND" }

      # Picture-in-picture windows for browsers (float-but-ignore so they
      # stay pinned where you drop them).
      - window_title: { regex: "[Pp]icture.in.[Pp]icture" }
        window_class: { regex: "Chrome_WidgetWin_1|MozillaDialogClass" }
      - window_process: { equals: "Arc" }
        window_title: { regex: "[Pp]icture.in.[Pp]icture" }

      # PowerToys / Lively helper surfaces.
      - window_process: { equals: "PowerToys" }
        window_class: { regex: 'HwndWrapper\[PowerToys\.PowerAccent.*?\]' }
      - window_process: { equals: "PowerToys" }
        window_title: { regex: ".*? - Peek" }
      - window_process: { equals: "Lively" }
        window_class: { regex: "HwndWrapper" }

  # =====================================================================
  # NOTE: No more per-launcher / per-game ignore rules. With floating-default,
  # DoomLauncher, N64RecompLauncher, EpicGamesLauncher, Steam, emulators,
  # recomp ports (Starship.exe, *Recompiled.exe), SoH, etc. ALL float
  # automatically — they're simply not on the allowlist. That's the point.
  # =====================================================================

binding_modes:
  # When enabled, the focused window can be resized via arrow keys or HJKL.
  - name: "resize"
    keybindings:
      - commands: ["resize --width -2%"]
        bindings: ["h", "left"]
      - commands: ["resize --width +2%"]
        bindings: ["l", "right"]
      - commands: ["resize --height +2%"]
        bindings: ["k", "up"]
      - commands: ["resize --height -2%"]
        bindings: ["j", "down"]
      # Press enter/escape to return to default keybindings.
      - commands: ["wm-disable-binding-mode --name resize"]
        bindings: ["escape", "enter"]

keybindings:
  # MOVE FOCUSED WINDOW — vim hjkl.
  #   left/up/down = lwin+h/k/j (native GlazeWM).
  #   RIGHT has NO native bind here: Windows reserves Win+L (lock) at the
  #   winlogon level, below keyboard hooks, so GlazeWM can never receive plain
  #   lwin+l. Move-window-right is handled ENTIRELY by the Raycast bridge:
  #   Win+L -> Raycast -> glaze-move-right.ps1 -> `move --direction right`.
  #   (See WIN-L-BRIDGE.md.) We freed lwin+shift+l for move-WORKSPACE-right
  #   below, so it intentionally does NOT move the window anymore.
  #   ⚠️ If Raycast isn't running, there is no move-window-right. Fallback:
  #   focus the right neighbor + move, or relaunch Raycast.
  - commands: ["move --direction left"]
    bindings: ["lwin+h"]
  - commands: ["move --direction up"]
    bindings: ["lwin+k"]
  - commands: ["move --direction down"]
    bindings: ["lwin+j"]
  # move-window-right: via Raycast Win+L bridge only (see comment above).

  # ── WINDOW STATE ──────────────────────────────────────────────────────
  - commands: ["toggle-tiling"] # float <-> tile toggle
    bindings: ["lwin+t"]
  - commands: ["toggle-fullscreen"]
    bindings: ["lwin+m"]

  # ── CLOSE WINDOW (Cmd+Q parity — Alt sits where mac's Cmd is) ──────────
  # Graceful WM_CLOSE of the focused window (the app's own close path; can
  # prompt to save). NOT an Alt+F4 keystroke remap — Alt+F4 stays native.
  - commands: ["close"]
    bindings: ["alt+q"]

  # ── CYCLE WORKSPACES (freed up native Alt+Tab) ─────────────────────────
  # Alt+Tab/Alt+Shift+Tab are intentionally left UNBOUND here so GlazeWM's
  # keyboard hook never claims them — that's what let Windows' native
  # Alt+Tab window switcher through again (the way Cmd+Tab-style app
  # switching works on macOS). GlazeWM's hook always wins the race for any
  # combo it has a binding on, so as long as alt+tab appeared anywhere in
  # this file, native Alt+Tab was permanently overridden, no exceptions.
  # Workspace cycling moved to lwin+tab / lwin+shift+tab instead.
  - commands: ["focus --next-active-workspace"]
    bindings: ["lwin+tab"]
  - commands: ["focus --prev-active-workspace"]
    bindings: ["lwin+shift+tab"]

  # ── WM CONTROL ────────────────────────────────────────────────────────
  - commands: ["wm-toggle-pause"] # freeze all binds (safety)
    bindings: ["lwin+shift+p"]
  - commands: ["wm-reload-config"] # after editing this file
    bindings: ["lwin+shift+r"]

  # NOTE: WezTerm quake dropdown is bound via AutoHotkey (quake-hotkey.ahk),
  # NOT GlazeWM — AHK owns the backtick key (bare ` toggles, ctrl+` = literal).

  # ── GO TO WORKSPACE (1-7 named, 8-10 overflow) ─────────────────────────
  - commands: ["focus --workspace 1"]
    bindings: ["lwin+1"]
  - commands: ["focus --workspace 2"]
    bindings: ["lwin+2"]
  - commands: ["focus --workspace 3"]
    bindings: ["lwin+3"]
  - commands: ["focus --workspace 4"]
    bindings: ["lwin+4"]
  - commands: ["focus --workspace 5"]
    bindings: ["lwin+5"]
  - commands: ["focus --workspace 6"]
    bindings: ["lwin+6"]
  - commands: ["focus --workspace 7"]
    bindings: ["lwin+7"]
  - commands: ["focus --workspace 8"]
    bindings: ["lwin+8"]
  - commands: ["focus --workspace 9"]
    bindings: ["lwin+9"]
  # SHOW DESKTOP (what native Win+D can't do under tiling): flip to the empty '0' workspace =
  # wallpaper + desktop icons; lwin+d again flips back (toggle_workspace_on_refocus).
  - commands: ["focus --workspace 0"]
    bindings: ["lwin+d"]
  - commands: ["focus --workspace 10"]
    bindings: ["lwin+0"]
  # (Removed the old lwin+d->ws9 show-desktop attempt — ws9 is a real overflow workspace that can
  #  hold windows, so it wasn't reliably "empty". Replaced above by the dedicated empty '0' workspace.)

  # ── SEND WINDOW TO WORKSPACE (1-10) ───────────────────────────────────
  - commands: ["move --workspace 1", "focus --workspace 1"]
    bindings: ["lwin+shift+1"]
  - commands: ["move --workspace 2", "focus --workspace 2"]
    bindings: ["lwin+shift+2"]
  - commands: ["move --workspace 3", "focus --workspace 3"]
    bindings: ["lwin+shift+3"]
  - commands: ["move --workspace 4", "focus --workspace 4"]
    bindings: ["lwin+shift+4"]
  - commands: ["move --workspace 5", "focus --workspace 5"]
    bindings: ["lwin+shift+5"]
  - commands: ["move --workspace 6", "focus --workspace 6"]
    bindings: ["lwin+shift+6"]
  - commands: ["move --workspace 7", "focus --workspace 7"]
    bindings: ["lwin+shift+7"]
  - commands: ["move --workspace 8", "focus --workspace 8"]
    bindings: ["lwin+shift+8"]
  - commands: ["move --workspace 9", "focus --workspace 9"]
    bindings: ["lwin+shift+9"]
  - commands: ["move --workspace 10", "focus --workspace 10"]
    bindings: ["lwin+shift+0"]

  # ── MOVE WHOLE WORKSPACE TO A MONITOR — vim hjkl on lwin+shift ───────
  # No collision: send-window uses lwin+shift+NUMBERS, this uses LETTERS.
  # Move-window-right (lwin+shift+l would clash) lives on the Raycast Win+L
  # bridge instead, freeing shift+l for move-workspace-right here.
  - commands: ["move-workspace --direction left"]
    bindings: ["lwin+shift+h"]
  - commands: ["move-workspace --direction down"]
    bindings: ["lwin+shift+j"]
  - commands: ["move-workspace --direction up"]
    bindings: ["lwin+shift+k"]
  - commands: ["move-workspace --direction right"]
    bindings: ["lwin+shift+l"]

# GlazeWM. Every keybind and which program owns it: dot_config/bootstrap/keyboard-map.md
#
# HOW THIS FILE WORKS
# 1. Deny by default. GlazeWM only manages apps named in window_rules; the catch-all at the bottom
#    ignores everything else, so games and launchers are left alone (they used to get frozen at
#    their tiny startup size). To add an app: put it in its workspace rule AND in the catch-all regex.
#    Miss the second and it is silently ignored.
# 2. Main window only. Matching by process alone also grabs the app's dialogs and drags them to its
#    workspace, where they look like they vanished. A second field (class or title) on a match means
#    "main window only"; dialogs float on the workspace you are on.
#    Zen MozillaWindowClass | Explorer CabinetWClass (the desktop is also "explorer") | File Pilot
#    "File Pilot" | Office XLMAIN/OpusApp/PPTFrameClass | Playnite and Steam by window title.
# 3. Monitors count 0-based, left to right by position: 0 Acer, 1 CRT, 2 ultrawide. Check with
#    `glazewm query monitors` after rearranging. Workspaces 1, 4, 5 and 7 share the ultrawide and only
#    one shows at a time, so a window sent to a hidden one looks gone.
# 4. Keys that look odd on purpose: Win+L goes through Raycast (Windows reserves it for lock);
#    Alt+Tab is unbound so the native switcher works; Win+D jumps to empty workspace 0 and back.
# 5. Playnite's pre-game script kills GlazeWM while a game runs and post-game restarts it.

general:
  startup_commands: []
  shutdown_commands: []
  config_reload_commands: []
  focus_follows_cursor: false
  toggle_workspace_on_refocus: true # Win+D twice flips back
  cursor_jump:
    enabled: true
    trigger: "monitor_focus"
  hide_method: "cloak"
  show_all_in_taskbar: false

gaps:
  scale_with_dpi: true
  inner_gap: "10px"
  outer_gap:
    top: "40px" # yasb bar
    right: "10px"
    bottom: "10px"
    left: "10px"

window_effects:
  focused_window:
    border:
      enabled: true
      color: "#8dbcff"
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: false
      style: "square"
    transparency:
      enabled: false
      opacity: "95%"
  other_windows:
    border:
      enabled: true
      color: "#a1a1a1"
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: false
      style: "square"
    transparency:
      enabled: false
      opacity: "0%"

window_behavior:
  initial_state: "floating" # rules below decide what tiles
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: false
      shown_on_top: false

# bind_to_monitor is 0-based, left to right: 0 Acer, 1 CRT, 2 ultrawide. Check: glazewm query monitors
workspaces:
  - name: "1"
    display_name: "" # main
    keep_alive: true
    bind_to_monitor: 2
  - name: "2"
    display_name: "" # comms
    keep_alive: true
    bind_to_monitor: 0
  - name: "3"
    display_name: "" # music
    keep_alive: true
    bind_to_monitor: 0
  - name: "4"
    display_name: "" # gamedev
    keep_alive: true
    bind_to_monitor: 2
  - name: "5"
    display_name: "" # play
    keep_alive: true
    bind_to_monitor: 2
  - name: "6"
    display_name: "" # media
    keep_alive: true
  - name: "7"
    display_name: "" # utils
    keep_alive: true
    bind_to_monitor: 2
  - name: "8"
    display_name: "" # crt; not keep_alive so Playnite shows through when empty
    bind_to_monitor: 1
  - name: "9"
  - name: "10"
  - name: "0" # show-desktop scratch, always empty

# Deny by default: only processes named here are managed; the catch-all at the bottom ignores the rest.
# Adding an app means adding it to its rule AND to the catch-all regex.
# A second field (class or title) means "main window only": dialogs fall through and float.
window_rules:
  - commands: ["set-tiling", "move --workspace 1"] # main
    match:
      - window_process: { regex: "Proton Mail" }
      - window_process: { regex: "zen" }
        window_class: { equals: "MozillaWindowClass" }
      - window_process: { equals: "7zFM" }
      - window_process: { equals: "explorer" }
        window_class: { equals: "CabinetWClass" }
      - window_process: { equals: "FPilot" }
        window_class: { equals: "File Pilot" }
      - window_process: { equals: "EXCEL" }
        window_class: { equals: "XLMAIN" }
      - window_process: { equals: "WINWORD" }
        window_class: { equals: "OpusApp" }
      - window_process: { equals: "POWERPNT" }
        window_class: { equals: "PPTFrameClass" }
      - window_process: { equals: "Obsidian" }

  - commands: ["set-tiling", "move --workspace 2"] # comms
    match:
      - window_process: { regex: "DiscordPTB|Discord|Vesktop|Slack|Teams|Telegram|Beeper" }

  - commands: ["set-tiling", "move --workspace 3"] # music
    match:
      - window_process: { regex: "Cider|[sS]potify|SoulseekQt" }

  - commands: ["set-tiling", "move --workspace 4"] # gamedev
    match:
      - window_process: { regex: "Code|Cursor|devenv|[Zz]ed|neovide|pycharm64|rider64|GMEdit" }
      - window_process: { regex: "Aseprite|paintdotnet|blender|HxD|[Gg]odot|Tiled|LDtk|GameMaker|microStudio|pico8|picotron|[Vv]oxatron|GB.?Studio|gb-studio|TrenchBroom|picocad|MagicaVoxel|[Ss]olarus" }
      - window_process: { regex: "Claude|LM Studio" }

  - commands: ["move --workspace 5"] # play; Playnite floats
    match:
      - window_process: { equals: "Playnite" }
        window_title: { equals: "Playnite" }

  - commands: ["set-tiling", "move --workspace 5"] # play; Steam's main window tiles
    match:
      - window_process: { equals: "steamwebhelper" }
        window_title: { equals: "Steam" }

  - commands: ["set-tiling", "move --workspace 6"] # media
    match:
      - window_process: { equals: "fladder" }
      - window_process: { regex: "vlc|FreeTube" }

  - commands: ["set-tiling", "move --workspace 7"] # utils
    match:
      - window_process: { equals: "logioptionsplus" }
      - window_process: { equals: "SystemSettings" }
      - window_process: { equals: "Taskmgr" }
      - window_process: { equals: "regedit" }
      - window_process: { equals: "SystemInformer" }
      - window_process: { regex: "Hotspot Shield" }
      - window_process: { equals: "deskflow" }
      - window_process: { equals: "rustdesk" }

  - commands: ["ignore"]
    match:
      # windows that share an allowlisted process
      - window_title: { regex: "[Pp]icture.in.[Pp]icture" }
        window_class: { regex: "Chrome_WidgetWin_1|MozillaDialogClass" }
      - window_process: { equals: "Arc" }
        window_title: { regex: "[Pp]icture.in.[Pp]icture" }
      - window_title: { regex: "yabo-shader-hud" }
      # the catch-all: every process not named above
      - window_process: { not_regex: "Proton Mail|zen|7zFM|explorer|FPilot|EXCEL|WINWORD|POWERPNT|DiscordPTB|Discord|Vesktop|Slack|Teams|Telegram|Beeper|Cider|[sS]potify|SoulseekQt|Code|Cursor|devenv|[Zz]ed|neovide|pycharm64|rider64|GMEdit|Aseprite|paintdotnet|blender|HxD|[Gg]odot|Tiled|LDtk|GameMaker|microStudio|pico8|picotron|[Vv]oxatron|GB.?Studio|gb-studio|TrenchBroom|picocad|MagicaVoxel|[Ss]olarus|Claude|LM Studio|Obsidian|Playnite|fladder|vlc|FreeTube|logioptionsplus|SystemSettings|Taskmgr|regedit|SystemInformer|Hotspot Shield|deskflow|steamwebhelper|rustdesk" }

binding_modes:
  - name: "resize" # no key enables this yet
    keybindings:
      - commands: ["resize --width -2%"]
        bindings: ["h", "left"]
      - commands: ["resize --width +2%"]
        bindings: ["l", "right"]
      - commands: ["resize --height +2%"]
        bindings: ["k", "up"]
      - commands: ["resize --height -2%"]
        bindings: ["j", "down"]
      - commands: ["wm-disable-binding-mode --name resize"]
        bindings: ["escape", "enter"]

keybindings:
  # move window; right is Win+L via Raycast (glaze-move-right.ps1), Windows reserves it
  - commands: ["move --direction left"]
    bindings: ["lwin+h"]
  - commands: ["move --direction up"]
    bindings: ["lwin+k"]
  - commands: ["move --direction down"]
    bindings: ["lwin+j"]

  # window state
  - commands: ["toggle-tiling"]
    bindings: ["lwin+t"]
  - commands: ["toggle-fullscreen"]
    bindings: ["lwin+m"]
  - commands: ["close"]
    bindings: ["alt+q"]

  # workspace cycle; Alt+Tab left unbound for the native switcher
  - commands: ["focus --next-active-workspace"]
    bindings: ["lwin+tab"]
  - commands: ["focus --prev-active-workspace"]
    bindings: ["lwin+shift+tab"]

  # wm control
  - commands: ["wm-toggle-pause"]
    bindings: ["lwin+shift+p"]
  - commands: ["wm-reload-config"]
    bindings: ["lwin+shift+r"]

  # go to workspace
  - commands: ["focus --workspace 1"]
    bindings: ["lwin+1"]
  - commands: ["focus --workspace 2"]
    bindings: ["lwin+2"]
  - commands: ["focus --workspace 3"]
    bindings: ["lwin+3"]
  - commands: ["focus --workspace 4"]
    bindings: ["lwin+4"]
  - commands: ["focus --workspace 5"]
    bindings: ["lwin+5"]
  - commands: ["focus --workspace 6"]
    bindings: ["lwin+6"]
  - commands: ["focus --workspace 7"]
    bindings: ["lwin+7"]
  - commands: ["focus --workspace 8"]
    bindings: ["lwin+8"]
  - commands: ["focus --workspace 9"]
    bindings: ["lwin+9"]
  - commands: ["focus --workspace 0"] # show desktop
    bindings: ["lwin+d"]
  - commands: ["focus --workspace 10"]
    bindings: ["lwin+0"]

  # send window to workspace
  - commands: ["move --workspace 1", "focus --workspace 1"]
    bindings: ["lwin+shift+1"]
  - commands: ["move --workspace 2", "focus --workspace 2"]
    bindings: ["lwin+shift+2"]
  - commands: ["move --workspace 3", "focus --workspace 3"]
    bindings: ["lwin+shift+3"]
  - commands: ["move --workspace 4", "focus --workspace 4"]
    bindings: ["lwin+shift+4"]
  - commands: ["move --workspace 5", "focus --workspace 5"]
    bindings: ["lwin+shift+5"]
  - commands: ["move --workspace 6", "focus --workspace 6"]
    bindings: ["lwin+shift+6"]
  - commands: ["move --workspace 7", "focus --workspace 7"]
    bindings: ["lwin+shift+7"]
  - commands: ["move --workspace 8", "focus --workspace 8"]
    bindings: ["lwin+shift+8"]
  - commands: ["move --workspace 9", "focus --workspace 9"]
    bindings: ["lwin+shift+9"]
  - commands: ["move --workspace 10", "focus --workspace 10"]
    bindings: ["lwin+shift+0"]

  # move whole workspace to a monitor
  - commands: ["move-workspace --direction left"]
    bindings: ["lwin+shift+h"]
  - commands: ["move-workspace --direction down"]
    bindings: ["lwin+shift+j"]
  - commands: ["move-workspace --direction up"]
    bindings: ["lwin+shift+k"]
  - commands: ["move-workspace --direction right"]
    bindings: ["lwin+shift+l"]
